# BunnyWarfare - Development (branch dev, image :nightly) with pgAdmin
#   docker compose -f docker-compose.dev.yml up -d
#   App:     http://localhost:2772
#   pgAdmin: http://localhost:2773   (no sign-in; database password: bunnywarfare)
name: bunnywarfare-dev

services:
  web:
    image: ghcr.io/real-ttx/bunnywarfare:nightly
    restart: unless-stopped
    ports:
      - "2772:2772"
    volumes:
      - web-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: bunnywarfare
      POSTGRES_USER: bunnywarfare
      POSTGRES_PASSWORD: bunnywarfare
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bunnywarfare -d bunnywarfare"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "2773:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bunnywarfare.example.com
      PGADMIN_DEFAULT_PASSWORD: bunnywarfare
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    configs:
      - source: servers
        target: /pgadmin4/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db

configs:
  servers:
    content: |
      {"Servers": {"1": {"Name": "BunnyWarfare", "Group": "Servers", "Host": "db", "Port": 5432, "MaintenanceDB": "bunnywarfare", "Username": "bunnywarfare", "SSLMode": "prefer"}}}

volumes:
  web-data:
  db-data:
  pgadmin-data:
