# BunnyWarfare - Release (branch main, image :latest)
#   docker compose up -d        ->  http://localhost:2772
# The first account that registers is the administrator (Administration: /Admin).
name: bunnywarfare

services:
  web:
    image: ghcr.io/real-ttx/bunnywarfare:latest
    restart: unless-stopped
    ports:
      - "2772:2772"
    volumes:
      - web-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: bunnywarfare
      POSTGRES_USER: bunnywarfare
      POSTGRES_PASSWORD: bunnywarfare
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bunnywarfare -d bunnywarfare"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  web-data:
  db-data:
